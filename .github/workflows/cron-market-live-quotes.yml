name: Cron — Refresh live_quotes (market hours)

# Replaces the in-process APScheduler "market_live_quotes" job that
# previously ran inside every uvicorn worker (N× duplication on Railway).
#
# Refreshes live_quotes for the union of {Supabase holdings, top-1500
# fair_value_history tickers} via yfinance fast_info. UPSERT-only, safe
# to re-run.
#
# Coverage expanded from 200 -> 1500 on 2026-05-18 (companion to PR #317
# price-staleness gate). Top-200 left HINDPETRO, POLICYBZR, MANKIND,
# POWERGRID and most mid/small-caps unrefreshed during market hours.
# Top-1500 now matches the pulse_daily universe (Nifty500 + mid/small
# watch). Throughput: parallel fast_info at 20 workers finishes ~1500
# tickers in ~3-4 min on GH-hosted runners — under the 10-min cron tick
# and 8-min workflow timeout.
#
# Schedule: every 10 minutes during NSE market hours (Mon-Fri,
# 09:15-15:30 IST = 03:45-10:00 UTC). The wrapper inside
# market_data_refresher.refresh_live_quotes is itself idempotent, so a
# duplicate fire from a late cron tick is harmless.
#
# Cost reduction (2026-06-07, infra cost audit phase 0):
#   - Was: */5 3-10 * * 1-5  -> ~7 ticks/hr × 6.25h × 5d × 4.3wk
#                              ≈ 938 runs/mo × ~4 min  ≈ 3,750 min/mo
#   - Now: */10 3-10 * * 1-5 -> ~4 ticks/hr × 6.25h × 5d × 4.3wk
#                              ≈ 537 runs/mo × ~4 min  ≈ 2,150 min/mo
#   - Saves ~1,600 min/mo on this workflow alone; coupled with the
#     fx-rates and index-snapshots cuts (sibling PR commits) total
#     audit savings ≈ 13k min/mo.
#
# Safety: market_data_service._HARD_STALE_THRESHOLD is 2 days and
# _FRESHNESS_THRESHOLD (warn-only) is 4 hours. A 10-min refresh
# cadence is nowhere near either gate.
#
# Secrets required:
#   - DATABASE_URL          : Neon/Aiven Postgres URL
#   - SUPABASE_URL          : holdings lookup
#   - SUPABASE_SERVICE_KEY  : holdings lookup

on:
  schedule:
    # */10 between 03:45-10:00 UTC, Mon-Fri. Cron can't express :45
    # offsets cleanly, so we run */10 from 03..10 UTC and rely on the
    # function's own no-op guard (collect_refresh_tickers returns []
    # off-hours-safe).
    - cron: "*/10 3-10 * * 1-5"
  workflow_dispatch:
    inputs:
      limit_fv:
        description: "Top-N tickers from fair_value_history (default 1500)"
        required: false
        default: "1500"
      workers:
        description: "Parallel yfinance fast_info workers (default 20)"
        required: false
        default: "20"

concurrency:
  group: cron-market-live-quotes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      PYTHONUNBUFFERED: "1"
      YIELDIQ_QUOTES_LIMIT_FV: ${{ github.event.inputs.limit_fv || '1500' }}
      YIELDIQ_QUOTES_WORKERS: ${{ github.event.inputs.workers || '20' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install "SQLAlchemy>=2.0" "psycopg2-binary" "yfinance>=0.2.40" supabase

      - name: Refresh live_quotes
        run: |
          # limit_fv + worker count come from env vars set on the job
          # (YIELDIQ_QUOTES_LIMIT_FV / YIELDIQ_QUOTES_WORKERS). Defaults
          # to 1500 tickers @ 20 workers. The wall-time print at the end
          # is intentional — future operators can grep workflow logs to
          # confirm the runtime stays under the 10-min cron tick.
          python -c "
          import os, time
          from backend.workers.market_data_refresher import collect_refresh_tickers, refresh_live_quotes
          t0 = time.time()
          tickers = collect_refresh_tickers()
          print(f'collected {len(tickers)} tickers (limit_fv={os.environ.get(\"YIELDIQ_QUOTES_LIMIT_FV\",\"-\")}, workers={os.environ.get(\"YIELDIQ_QUOTES_WORKERS\",\"-\")})')
          if tickers:
              stats = refresh_live_quotes(tickers)
              elapsed = time.time() - t0
              print(f'stats: {stats}')
              print(f'wall_time_seconds={elapsed:.1f}')
              # Soft alarm: if a single tick ever exceeds 8 min we are
              # one bad yfinance day away from blowing through the
              # 10-min cron interval. Surface as a warning annotation.
              if elapsed > 480:
                  print(f'::warning::live_quotes refresh took {elapsed:.0f}s — close to 10-min cron interval. Consider lowering YIELDIQ_QUOTES_LIMIT_FV or splitting into two staggered workflows.')
          else:
              print('no tickers — no-op')
          "

      - name: Write cron heartbeat
        # Dead-man monitoring (see .github/workflows/cron-deadman-checker.yml).
        # Only writes on success — a failed refresh deliberately leaves the
        # heartbeat stale so the 30-min checker will flag it.
        if: success()
        run: |
          python scripts/write_cron_heartbeat.py \
            --workflow cron-market-live-quotes \
            --interval-minutes 10
