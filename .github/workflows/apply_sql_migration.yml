name: Apply SQL Migration (generic, one-off)

# Generic SQL migration applier — takes a migration filename and runs
# it against prod Neon Postgres via secrets.DATABASE_URL. This is the
# workflow_dispatch counterpart to ``migrate.yml`` which uses a fixed
# choice list; this one accepts any file under
# ``data_pipeline/migrations/`` so it can run timestamp-prefixed
# migrations (post-2026-06-03 standing rule) without needing the
# choice list to be updated for every new file.
#
# Reuses ``scripts/apply_migration.py`` (psycopg2-based, splits on
# semicolons naively — fine for our standard DDL). Do NOT re-invent.
#
# Defaults to dry-run so an accidental dispatch is harmless. Flip
# ``dry_run`` to ``false`` only when you intend the SQL to actually
# hit the database.
#
# Secrets required:
#   - DATABASE_URL : Aiven / Neon Postgres URL
# If missing, skip cleanly.

on:
  workflow_dispatch:
    inputs:
      migration_file:
        description: "Path under data_pipeline/migrations/ (e.g. 202606101845_fair_value_history_yieldiq_score.sql)"
        required: true
        type: string
      dry_run:
        description: "Print SQL preview and exit without executing"
        required: false
        type: boolean
        default: true

concurrency:
  group: apply-sql-migration
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check for DATABASE_URL
        id: env_check
        env:
          DB: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DB" ]; then
            echo "::warning::DATABASE_URL missing — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.env_check.outputs.skip == 'false'
        uses: actions/checkout@v4

      - name: Setup Python
        if: steps.env_check.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install psycopg2-binary
        if: steps.env_check.outputs.skip == 'false'
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary

      - name: Verify migration file exists
        if: steps.env_check.outputs.skip == 'false'
        env:
          MIGRATION_FILE: ${{ inputs.migration_file }}
        run: |
          FULL_PATH="data_pipeline/migrations/${MIGRATION_FILE}"
          if [ ! -f "$FULL_PATH" ]; then
            echo "::error::migration file not found: $FULL_PATH"
            ls data_pipeline/migrations/ | tail -20
            exit 1
          fi
          echo "found: $FULL_PATH"
          echo "FULL_PATH=$FULL_PATH" >> "$GITHUB_ENV"

      - name: Log filename + SQL preview
        if: steps.env_check.outputs.skip == 'false'
        run: |
          echo "===== migration: $FULL_PATH ====="
          echo "----- first 200 chars -----"
          head -c 200 "$FULL_PATH"
          echo ""
          echo "----- end preview -----"
          echo "byte count: $(wc -c < "$FULL_PATH")"
          echo "line count: $(wc -l < "$FULL_PATH")"

      - name: Dry-run exit
        if: steps.env_check.outputs.skip == 'false' && inputs.dry_run == true
        run: |
          echo "::notice::dry_run=true — exiting without applying."
          echo "to apply, re-dispatch with dry_run=false."
          exit 0

      - name: Apply migration
        if: steps.env_check.outputs.skip == 'false' && inputs.dry_run == false
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/apply_migration.py "$FULL_PATH"

      - name: Verify DB still reachable
        if: steps.env_check.outputs.skip == 'false' && inputs.dry_run == false
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          import sys
          import psycopg2
          url = os.environ["DATABASE_URL"]
          conn = psycopg2.connect(url)
          cur = conn.cursor()
          cur.execute("SELECT 1")
          row = cur.fetchone()
          cur.close()
          conn.close()
          assert row == (1,), f"unexpected result: {row}"
          print("post-migration connectivity OK (SELECT 1 -> 1)")
          PY
