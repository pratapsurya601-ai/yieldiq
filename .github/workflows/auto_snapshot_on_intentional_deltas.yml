name: Auto-snapshot on merge (intentional FV deltas)

# Triggered when a PR is merged into main. If the merged PR body contained
# a non-empty `intentional-fv-deltas:` block, this workflow:
#
#   1. Re-runs `scripts/snapshot_50_stocks.py` against production
#   2. Commits the resulting snapshot back to main with `[skip ci]` so
#      we don't loop CI on a chore commit
#   3. Tags the commit message with the source PR number for traceability
#
# Why: when a PR intentionally moves fair-value for a ticker, the canary
# baseline must be refreshed or every subsequent PR sees a stale-baseline
# diff and the canary screams. Doing it manually is the kind of step
# everybody forgets at 6 PM.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write   # we push the snapshot commit back to main

jobs:
  auto-snapshot:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Cheap substring precheck BEFORE we spin up Python or even check
      # out the repo. Short-circuits PRs whose body never even mentions
      # the marker (e.g. bot PRs, force-pushed feature branches that
      # stripped the template). Note: the YieldIQ PR template ships with
      # the literal string `intentional-fv-deltas:` as an example block,
      # so many PRs DO contain the substring without actually declaring
      # any tickers — those fall through to the Python parser, which
      # already filters the `TICKER` placeholder out and returns the
      # empty set. The defence-in-depth below (continue-on-error on the
      # detect step) ensures a broken parser cannot fail the workflow
      # for any of these "template kept, no real declaration" PRs.
      - name: Early exit if PR body has no intentional-fv-deltas marker
        id: precheck
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [[ "$PR_BODY" != *"intentional-fv-deltas"* ]]; then
            echo "PR body has no intentional-fv-deltas marker — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "PR body mentions intentional-fv-deltas — running full parser."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout main
        if: steps.precheck.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        if: steps.precheck.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.precheck.outputs.skip == 'false'
        run: pip install requests

      - name: Detect intentional-fv-deltas in merged PR body
        id: detect
        if: steps.precheck.outputs.skip == 'false'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Reuse the canary_diff parser so this stays in lockstep with
          # the gate. If the parser fails (import error, signature
          # change, etc.) we MUST NOT fail the workflow — the workflow
          # runs on every PR merge and a parser blow-up would otherwise
          # mark every merged PR red. Default to has_deltas=false on any
          # error; the worst case is one missed auto-snapshot, which a
          # human can run manually via `scripts/snapshot_50_stocks.py`.
          mkdir -p .ci-tmp
          printf '%s' "$PR_BODY" > .ci-tmp/pr_body.md
          set +e
          python - <<'PY' > .ci-tmp/parse.log 2>&1
          import sys, json, pathlib
          sys.path.insert(0, "scripts")
          import canary_diff
          body = pathlib.Path(".ci-tmp/pr_body.md").read_text(encoding="utf-8", errors="replace")
          tickers = sorted(canary_diff._parse_intentional_deltas_text(body))
          out = pathlib.Path(".ci-tmp/intentional.json")
          out.write_text(json.dumps(tickers))
          print(f"intentional-fv-deltas: {tickers}")
          PY
          PARSE_RC=$?
          set -e
          cat .ci-tmp/parse.log
          if [ "$PARSE_RC" -ne 0 ] || [ ! -f .ci-tmp/intentional.json ]; then
            echo "::warning::canary_diff parser failed (rc=$PARSE_RC); defaulting has_deltas=false. Run snapshot_50_stocks.py manually if this PR declared intentional FV deltas."
            echo "tickers=[]" >> "$GITHUB_OUTPUT"
            echo "has_deltas=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TICKERS=$(cat .ci-tmp/intentional.json)
          echo "tickers=${TICKERS}" >> "$GITHUB_OUTPUT"
          if [ "${TICKERS}" = "[]" ]; then
            echo "has_deltas=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_deltas=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run snapshot
        if: steps.detect.outputs.has_deltas == 'true'
        env:
          CANARY_API_BASE: https://api.yieldiq.in
          CANARY_AUTH_TOKEN: ${{ secrets.CANARY_AUTH_TOKEN }}
        run: python scripts/snapshot_50_stocks.py

      - name: Commit snapshot to main
        if: steps.detect.outputs.has_deltas == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TICKERS: ${{ steps.detect.outputs.tickers }}
        run: |
          git config user.name "yieldiq-ci-bot"
          git config user.email "ci-bot@yieldiq.in"
          # Stage anything the snapshot script wrote — it lives under
          # scripts/snapshots/ but we're permissive in case the script
          # also updates canary_stocks_50.json or similar.
          git add scripts/snapshots/ scripts/canary_stocks_50.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit (script may be a no-op)."
            exit 0
          fi
          git commit -m "chore: auto-snapshot post-merge of PR #${PR_NUMBER} (intentional FV deltas) [skip ci]

Tickers declared as intentional-fv-deltas in PR #${PR_NUMBER}: ${TICKERS}

Generated by .github/workflows/auto_snapshot_on_intentional_deltas.yml."
          git push origin main
