name: NSE indices backfill (manual)

# Deep-backfill nse_index_history from the NSE ind_close_all archive so the
# benchmark proxy has multi-year history (the daily cron only keeps recent
# weeks). One CSV/day, ~110 indices, back to 2014 (~3,000 trading days).
# Idempotent; resume=true skips dates already present.
#
# Secrets: DATABASE_URL (Neon, read+write).

on:
  workflow_dispatch:
    inputs:
      start:
        description: "First date YYYY-MM-DD"
        type: string
        default: "2014-01-01"
      end:
        description: "Last date YYYY-MM-DD (blank = today)"
        type: string
        default: ""
      throttle:
        description: "Seconds between day requests"
        type: string
        default: "0.3"
      resume:
        description: "Skip dates already present"
        type: boolean
        default: true

# Concurrency group is per date-range so several shards (distinct start
# dates) can run AT THE SAME TIME — the backfill is parallelized by
# dispatching disjoint year ranges concurrently. Two dispatches with the
# same start still serialize (safe).
concurrency:
  group: nse-indices-backfill-${{ github.event.inputs.start }}
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install "psycopg2-binary" "curl_cffi>=0.7"
      - name: Run NSE indices backfill
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret missing"; exit 1
          fi
          RESUME=""
          if [ "${{ inputs.resume }}" = "true" ]; then RESUME="--resume"; fi
          END=""
          if [ -n "${{ inputs.end }}" ]; then END="--end ${{ inputs.end }}"; fi
          python scripts/backfill_nse_indices.py \
            --start "${{ inputs.start }}" \
            $END \
            --throttle "${{ inputs.throttle }}" \
            $RESUME
