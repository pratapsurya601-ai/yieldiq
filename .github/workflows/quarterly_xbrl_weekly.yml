name: Quarterly XBRL — Weekly company_quarterly_results loader

# The systemic gap this closes: nothing ran the quarterly-XBRL loader on
# a cron, so any ticker outside a manual --batch silently stayed on stale
# yfinance TTM. This runs scripts/backfill_nse_quarterly_xbrl.py over the
# whole stocks-table universe (--universe), sharded, every week.
#
# Pulls NSE's /api/corporates-financial-results filings list, downloads
# each XBRL file from nsearchives.nseindia.com (open, no Akamai wall),
# parses + UPSERTs into company_quarterly_results.
#
# Per ticker ~5-10s (master call + a few XBRL downloads). Whole universe
# across 5 shards runs in parallel.
#
# Secrets required:
#   - DATABASE_URL : Neon Postgres connection string (read+write)

on:
  workflow_dispatch:
    inputs:
      shards:
        description: "Parallel shards (1-5)"
        required: false
        default: "5"
      top:
        description: "Top-N by market cap (blank = all)"
        required: false
        default: ""
  schedule:
    - cron: "0 5 * * 6"  # Saturday 05:00 UTC = 10:30 IST

concurrency:
  group: quarterly-xbrl-weekly
  cancel-in-progress: false

jobs:
  backfill:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install 'psycopg[binary]>=3.1' psycopg2-binary sqlalchemy \
                       requests curl_cffi lxml

      - name: Skip if shard >= shards
        id: guard
        run: |
          SHARDS="${{ github.event.inputs.shards || '5' }}"
          if [ "${{ matrix.shard }}" -ge "$SHARDS" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run shard ${{ matrix.shard }}
        if: steps.guard.outputs.skip == 'false'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          SHARDS="${{ github.event.inputs.shards || '5' }}"
          ARGS="--apply --universe --shard ${{ matrix.shard }}/$SHARDS"
          if [ -n "${{ github.event.inputs.top }}" ]; then
            ARGS="$ARGS --top ${{ github.event.inputs.top }}"
          fi
          python scripts/backfill_nse_quarterly_xbrl.py $ARGS

  summary:
    needs: backfill
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Coverage
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pip install psycopg2-binary --quiet
          python - <<'PY'
          import os, psycopg2
          c = psycopg2.connect(os.environ["DATABASE_URL"]); cur = c.cursor()
          cur.execute("SELECT COUNT(*), COUNT(DISTINCT ticker) FROM company_quarterly_results")
          t, tk = cur.fetchone()
          cur.execute("SELECT COUNT(DISTINCT ticker) FROM company_quarterly_results WHERE ingested_at > now() - interval '2 days'")
          fresh = cur.fetchone()[0]
          print(f"quarterly rows:        {t:,}")
          print(f"distinct tickers:      {tk:,}")
          print(f"  ingested <2d ago:    {fresh:,}")
          PY
