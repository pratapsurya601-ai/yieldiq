name: Cron — Dead-man checker

# Runs every 30 minutes. Reads cron_heartbeats and opens a GitHub issue
# (tagged `cron-down`) if any monitored workflow is more than
# 2 * expected_interval_minutes behind its last successful run.
#
# Companion to scripts/write_cron_heartbeat.py, which each monitored
# cron workflow calls as its final step. Origin: 2026-05-18, after we
# discovered cron-market-live-quotes was firing only ~1 of 37 expected
# slots during market hours with no alert (GH Actions cron is unreliable
# under load).
#
# Secrets required:
#   - DATABASE_URL : Neon/Aiven Postgres URL (read-only access to
#                    cron_heartbeats is sufficient).
#   - GITHUB_TOKEN : auto-provided; needs `issues: write` (granted in
#                    permissions: below).

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

concurrency:
  group: cron-deadman-checker
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install "psycopg2-binary"

      - name: Run dead-man check
        id: check
        run: |
          python scripts/check_cron_deadman.py --json > deadman.json
          cat deadman.json
          echo "dead_count=$(python -c 'import json; print(len(json.load(open("deadman.json"))["dead"]))')" >> "$GITHUB_OUTPUT"

      - name: Open/update/close dead-man issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('deadman.json', 'utf-8'));
            const dead = report.dead || [];

            // Stable title — single rolling issue regardless of date or count.
            // Prevents the 15-issue pile-up we hit 2026-05-17→24 where every
            // change in count/date opened a brand-new issue.
            const title = '[cron-down] one or more cron workflows stale';

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'cron-down',
              per_page: 100,
            });
            const open = existing.data.find(i => i.title === title);

            // Recovery path: no dead workflows + open issue → close it.
            if (dead.length === 0) {
              if (open) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: open.number,
                  body: `All monitored crons recovered as of run ${context.runId}. Auto-closing.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: open.number,
                  state: 'closed',
                });
                core.info(`Auto-closed #${open.number} on recovery.`);
              }
              return;
            }

            const today = new Date().toISOString().slice(0, 10);
            let body = `Detected ${dead.length} cron workflow(s) past 2x their declared interval (snapshot ${today}).\n\n`;
            body += '| workflow | age (min) | threshold (min) | last_success_at |\n';
            body += '|---|---:|---:|---|\n';
            for (const d of dead) {
              body += `| \`${d.workflow_name}\` | ${d.age_minutes} | ${d.threshold_minutes} | ${d.last_success_at} |\n`;
            }
            body += `\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n`;
            body += '\nFix path:\n';
            body += '1. Check the workflow\'s recent runs page — was GH Actions skipping ticks?\n';
            body += '2. If the workflow is running but failing, treat as a normal incident.\n';
            body += '3. If GH Actions silently skipped, consider splitting/staggering or moving to Railway worker.\n';

            if (open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.number,
                body: `Still dead at run ${context.runId}:\n\n${body}`,
              });
              core.info(`Commented on existing issue #${open.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['cron-down', 'ops'],
              });
              core.info(`Opened issue #${created.data.number}`);
            }
