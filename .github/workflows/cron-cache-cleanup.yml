name: Cron — Cleanup analysis_cache (daily 02:00 IST)

# Daily prune of stale `cache_version` rows from `analysis_cache`.
#
# Why: backend/services/cache_service.py exposes a `cleanup()` method
# but it has zero callers (see docs/design/memory-baseline-investigation.md
# section 1.3). After a CACHE_VERSION bump, version-keyed rows linger
# in the persistent tier-2 `analysis_cache` table until manually
# pruned. On a heavy-bump day (21 bumps in 24h on 2026-05-17) this
# accumulates significant dead rows + bloat.
#
# The in-memory `cache.cleanup()` is per-process and cannot be called
# from a cron worker (no shared memory with the API container), so
# this job operates on the persistent DB tier instead. The in-memory
# tier expires naturally on its TTL.
#
# Schedule: 03:30 UTC daily. Per the task spec this is the target;
# off-market window, low traffic.
#
# Per project discipline (memory/feedback_yieldiq_discipline.md):
#   - runs ONLY in GH Actions; never in the Railway worker.
#   - no CACHE_VERSION bump — the script only prunes by existing
#     `cache_version` values, it does not write any.

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report only, do not delete"
        required: false
        default: "false"
      keep_previous:
        description: "Number of previous versions to retain (in addition to current)"
        required: false
        default: "2"

concurrency:
  group: cron-cache-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install "SQLAlchemy>=2.0" "psycopg2-binary"

      - name: Run cache cleanup
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          python scripts/run_cache_cleanup.py \
            $DRY_RUN_FLAG \
            --keep-previous "${{ github.event.inputs.keep_previous || '2' }}"
