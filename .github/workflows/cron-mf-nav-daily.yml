name: Cron — AMFI MF NAV daily ingest

# Daily pull of NAVAll.txt from AMFI and upsert into fund_nav_history.
#
# Schedule: 23:15 IST market days = 17:45 UTC Mon-Fri.
# AMFI publishes NAVAll.txt by ~22:30 IST on market days; a 45-minute
# buffer absorbs publication delay and the 15-minute slack on GH Actions
# cron firing. We also fire Saturday at the same wall-clock to catch
# any Friday EOD publication that landed late.
#
# Idempotent: ON CONFLICT (scheme_code, nav_date) DO UPDATE on every row.
# Holiday safety: parse_navall drops rows with null/zero NAV, so a
# holiday run (when AMFI publishes a blank file for non-trading
# schemes) is a no-op rather than an error.
#
# Secrets required:
#   - DATABASE_URL : Neon Postgres connection string (read+write).

on:
  schedule:
    - cron: "45 17 * * 1-6"  # 17:45 UTC = 23:15 IST, Mon-Sat
  workflow_dispatch:

concurrency:
  group: cron-mf-nav-daily
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
      # PYTHONPATH=. so `python -m data_pipeline.sources.amfi_nav`
      # resolves the in-tree package. The repo has no pyproject.toml /
      # setup.py, so without this the runner exits with
      # ModuleNotFoundError: No module named 'data_pipeline'.
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install "psycopg2-binary" "requests>=2.31"

      - name: Run AMFI NAV ingest
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret missing"
            exit 1
          fi
          python -m data_pipeline.sources.amfi_nav

      - name: Write cron heartbeat
        if: success()
        run: |
          python scripts/write_cron_heartbeat.py \
            --workflow cron-mf-nav-daily \
            --interval-minutes 1440
