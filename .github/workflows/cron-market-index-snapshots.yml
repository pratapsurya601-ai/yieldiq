name: Cron — Refresh index_snapshots (every 15min)

# Replaces the in-process APScheduler "market_index_snapshots" job.
# Pulls quotes for NIFTY/SENSEX/sector benchmarks/gold/silver/VIX from
# yfinance and UPSERTs into index_snapshots. 24x7 (off-hours rows are
# stale-but-correct and used by the sector retrospective endpoints).
#
# Schedule: every 15 minutes.
#
# Secrets required:
#   - DATABASE_URL : Neon/Aiven Postgres URL

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: cron-market-index-snapshots
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install "SQLAlchemy>=2.0" "psycopg2-binary" "yfinance>=0.2.40"

      - name: Refresh index_snapshots
        run: |
          python -c "
          from backend.workers.market_data_refresher import refresh_index_snapshots
          stats = refresh_index_snapshots()
          print(f'stats: {stats}')
          "

      - name: Write cron heartbeat
        # Dead-man monitoring (see .github/workflows/cron-deadman-checker.yml).
        if: success()
        run: |
          python scripts/write_cron_heartbeat.py \
            --workflow cron-market-index-snapshots \
            --interval-minutes 15
