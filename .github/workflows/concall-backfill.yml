name: Concall Backfill (operator)

# ─────────────────────────────────────────────────────────────────
# Phase G-operator-workflow: single button to run any phase of the
# concall backfill chain from the GitHub Actions UI.
#
# Phases (in execution order when `all` is selected):
#
#   1. transcripts — scripts/backfill_concall_transcripts.py
#        Fetches new earnings-call PDFs from NSE for the top-N
#        tickers over the last `days_back` days. No LLM spend.
#        Existing weekly cron (concall_transcripts_weekly.yml) runs
#        with --days-back 120; here the operator can re-run with a
#        longer window for a historical backfill (default 1825 = 5y).
#
#   2. summaries — scripts/backfill_concall_summaries.py
#        Generates Groq free-text summaries for transcripts that
#        don't already have one. Cheap (cents per row) but the
#        --cost-cap-usd flag (PR #563) hard-stops the batch if
#        spend climbs unexpectedly.
#
#   3. signals — scripts/extract_concall_signals_batch.py
#        Generates STRUCTURED Anthropic signal extractions (guidance,
#        capex, margin, tone, key quotes). ~10x the per-row cost of
#        the Groq summary path — the --cost-cap-usd hard-stop is
#        especially important here.
#
#   4. all — runs 1 → 2 → 3 in sequence.
#
# Secrets required (all already configured at repo level):
#   - DATABASE_URL       — Neon PG connection string for read+write.
#   - GROQ_API_KEY       — used by the summaries phase.
#   - ANTHROPIC_API_KEY  — used by the signals phase.
#
# Runbook: docs/runbooks/phase-g-concall-backfill.md
# ─────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Which phase to run"
        type: choice
        required: true
        default: all
        options:
          - transcripts
          - summaries
          - signals
          - all
      top_n:
        description: "Top-N tickers (by market cap) to target"
        type: number
        required: true
        default: 200
      days_back:
        description: "Days of history to backfill (transcripts phase only)"
        type: number
        required: true
        default: 1825
      cost_cap_usd:
        description: "Hard-stop USD spend per LLM phase (summaries / signals)"
        type: number
        required: true
        default: 100
      dry_run:
        description: "Dry-run (no DB writes, no LLM calls)"
        type: boolean
        required: true
        default: true

permissions:
  contents: read

jobs:
  backfill:
    name: ${{ inputs.phase }} (top=${{ inputs.top_n }}, dry=${{ inputs.dry_run }})
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements.txt

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Build dry-run flag
        id: flags
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "dry=--dry-run" >> "$GITHUB_OUTPUT"
          else
            echo "dry=" >> "$GITHUB_OUTPUT"
          fi

      # Phase 1: transcripts. Uses --top for the universe size and
      # --days-back for the history window. No LLM spend so the
      # cost-cap flag is not threaded through here.
      - name: "Phase: transcripts"
        if: ${{ inputs.phase == 'transcripts' || inputs.phase == 'all' }}
        run: |
          python scripts/backfill_concall_transcripts.py \
            --top ${{ inputs.top_n }} \
            --days-back ${{ inputs.days_back }} \
            ${{ steps.flags.outputs.dry }}

      # Phase 2: summaries. Note: the summaries script names its
      # universe-limit flag --max-tickers (not --top); the workflow
      # input is named `top_n` for operator-facing consistency.
      - name: "Phase: summaries"
        if: ${{ inputs.phase == 'summaries' || inputs.phase == 'all' }}
        run: |
          python scripts/backfill_concall_summaries.py \
            --max-tickers ${{ inputs.top_n }} \
            --cost-cap-usd ${{ inputs.cost_cap_usd }} \
            ${{ steps.flags.outputs.dry }}

      # Phase 3: signals. Anthropic-backed structured extraction.
      # The script's universe limit is --max-rows (one row per
      # transcript), so the `top_n` input is reused for the row cap.
      - name: "Phase: signals"
        if: ${{ inputs.phase == 'signals' || inputs.phase == 'all' }}
        run: |
          python scripts/extract_concall_signals_batch.py \
            --max-rows ${{ inputs.top_n }} \
            --cost-cap-usd ${{ inputs.cost_cap_usd }} \
            ${{ steps.flags.outputs.dry }}

      - name: Summary
        if: always()
        run: |
          echo "Phase: ${{ inputs.phase }}"
          echo "top_n: ${{ inputs.top_n }}"
          echo "days_back: ${{ inputs.days_back }}"
          echo "cost_cap_usd: ${{ inputs.cost_cap_usd }}"
          echo "dry_run: ${{ inputs.dry_run }}"
