name: Post-Deploy Smoke Test
# E2E smoke test of /api/v1/public/stock-summary against 12 anchor tickers
# covering every valuation path (DCF, rate_base, peer_capped, ETF NAV,
# REIT NAV/DPU, holdco SOTP). Replaces the manual post-Railway-deploy
# curl checks.

env:
  API_BASE: "https://api.yieldiq.in"

on:
  workflow_dispatch:
  schedule:
    # Every 30 min during NSE market hours (Mon-Fri, 09:30-15:30 IST = 04:00-10:00 UTC)
    - cron: "0,30 4-9 * * 1-5"
    - cron: "0 10 * * 1-5"
  push:
    branches: [main]
    paths:
      - "scripts/post_deploy_smoke_test.py"
      - ".github/workflows/post-deploy-smoke-test.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run post-deploy smoke test
        id: smoke
        run: |
          python scripts/post_deploy_smoke_test.py \
            --api-base "${API_BASE}" \
            --report smoke_report.json \
            --verbose

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: smoke_report.json
          retention-days: 30

      - name: Open / refresh GitHub issue on scheduled failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let r = { passed: '?', total: 12, results: [] };
            try { r = JSON.parse(fs.readFileSync('smoke_report.json', 'utf8')); } catch(e) {}
            const failed = (r.results || []).filter(x => !x.passed);
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const lines = failed.map(f => `- **${f.ticker}**: ${(f.issues || []).join('; ')}`).join('\n');
            // STABLE title so a changing pass-count (10/12 vs 11/12) does NOT
            // spawn a new issue each run — the live count lives in the body.
            // The prior count-in-title broke exact-match dedupe and piled up.
            const TITLE = 'Post-deploy smoke FAIL';
            const today = new Date().toISOString().slice(0, 10);
            const body = `Scheduled post-deploy smoke test failing: **${r.passed}/${r.total}** anchors passing (updated ${today}).\n\nRun: ${runUrl}\n\n### Failing anchors\n${lines || '(none)'}\n`;
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', per_page: 100,
            });
            const existing = open.data.find(i => i.title === TITLE && !i.pull_request);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body,
              });
              core.info(`Refreshed existing smoke issue #${existing.number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: TITLE, body, labels: ['smoke-test', 'bug'],
              });
            }

      - name: Close smoke issue on scheduled recovery
        if: success() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            // Dead-man recovery: a clean scheduled smoke run auto-closes any
            // open smoke-fail issue, so a transient failure never lingers.
            const TITLE = 'Post-deploy smoke FAIL';
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', per_page: 100,
            });
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            for (const i of open.data.filter(x => x.title === TITLE && !x.pull_request)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number,
                body: `Auto-closing: scheduled post-deploy smoke is green again (run ${runUrl}).`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number, state: 'closed',
              });
              core.info(`Closed recovered smoke issue #${i.number}`);
            }

      - name: Annotate failure
        if: failure()
        run: |
          echo "::error::Post-deploy smoke test FAILED -- production stock-summary API regression"
          echo "Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
