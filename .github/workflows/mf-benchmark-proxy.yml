name: MF benchmark proxy (manual)

# Route A benchmark build: map funds -> SEBI category benchmark, then
# synthesize a total-return PROXY for each NIFTY TRI code from
# nse_index_history (price close + dividend yield) into
# fund_benchmark_history. Once this lands, the recompute fills in
# benchmark beta/alpha/excess/capture and the /funds detail page's
# Benchmark + Excess rows un-hide themselves.
#
# Run mode=dry-run FIRST (writes nothing; logs the prereq + coverage
# state) before mode=apply. CRISIL_* (debt/hybrid) benchmarks are not in
# the NSE feed and stay deferred.
#
# Secrets: DATABASE_URL (Neon, read+write for apply).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (report only) or apply (write)"
        type: choice
        default: dry-run
        options: [dry-run, apply]

concurrency:
  group: mf-benchmark-proxy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install "psycopg2-binary"
      - name: Build benchmark proxy
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret missing"; exit 1
          fi
          DRY=""
          if [ "${{ inputs.mode }}" != "apply" ]; then DRY="--dry-run"; fi
          python scripts/build_benchmark_proxy.py $DRY
