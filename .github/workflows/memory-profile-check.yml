name: Memory Profile Check

# Catches memory regressions before they ship. Runs scripts/profile_memory_anchors.py
# in-process (no real server) against the 12 anchor tickers and fails the PR if
# peak RSS exceeds tolerance × baseline (default 1.20×).
#
# To rebaseline after an intentional change (e.g. worker tuning, new model load):
#   python scripts/profile_memory_anchors.py --update-baseline
#   git add scripts/memory_baseline.json && git commit
#
# Background: docs/design/memory-baseline-investigation.md
#   4-worker baseline was 1.3 GB; PR #326 cut to 2 workers → ~700 MB.

on:
  pull_request:
    # ci-cost-opt 2026-06-07: tightened from `backend/**` to the four
    # runtime-loaded subdirs. The previous filter triggered this ~15-min
    # workflow on every PR that touched `backend/tests/`, `backend/CLAUDE.md`,
    # `backend/migrations/*.sql`, none of which can affect runtime memory.
    # Same memory-relevant changes (services / routers / models / validators
    # under backend/, and the standalone models/ directory) still trigger.
    # Estimated savings: ~600-900 min/month — by far the largest single fix.
    paths:
      - "backend/services/**"
      - "backend/routers/**"
      - "backend/models/**"
      - "backend/validators/**"
      - "models/**"
      - "scripts/profile_memory_anchors.py"
      - "scripts/memory_baseline.json"
      - ".github/workflows/memory-profile-check.yml"
  workflow_dispatch:

# ci-cost-opt 2026-06-07: cancel in-progress PR runs on rebase. This is the
# heaviest PR-triggered workflow (~12 min/run, installs full backend deps).
# A wasted run during a rebase storm is the single biggest per-event burn.
# Estimated additional savings: ~60-120 min/month.
concurrency:
  group: memory-profile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  memory-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r backend/requirements_backend.txt
          pip install psutil httpx

      - name: Run memory profile against anchors
        env:
          # Run with the same worker count assumption as the fix in PR #326.
          WEB_CONCURRENCY: "1"
          # Avoid pulling secrets / hitting external services where possible.
          YIELDIQ_CI_MODE: "1"
        run: |
          python scripts/profile_memory_anchors.py --output memory_profile.json

      - name: Upload memory profile artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-profile
          path: memory_profile.json
