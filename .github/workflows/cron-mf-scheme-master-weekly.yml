name: Cron — AMFI MF scheme master weekly

# Weekly refresh of the funds master table from AMFI's NAVAll feed.
# Parses scheme_name into structured plan + option and upserts to
# funds. Schemes that drop out of the AMFI feed are soft-deactivated
# (is_active = FALSE); historical NAV rows are preserved.
#
# Schedule: Sunday 06:00 IST = 00:30 UTC.
# Sunday morning is the calmest window for the AMFI portal and lets
# us catch the prior week's scheme additions / mergers before the
# next set of daily NAV ingests start using them as the FK reference.
#
# Secrets required:
#   - DATABASE_URL : Neon Postgres connection string (read+write).

on:
  schedule:
    - cron: "30 0 * * 0"  # 00:30 UTC Sun = 06:00 IST Sun
  workflow_dispatch:

concurrency:
  group: cron-mf-scheme-master-weekly
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
      # PYTHONPATH=. so `python -m data_pipeline.sources.amfi_scheme_master`
      # resolves the in-tree package. The repo has no pyproject.toml /
      # setup.py, so without this the runner exits with
      # ModuleNotFoundError: No module named 'data_pipeline'.
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install "psycopg2-binary" "requests>=2.31"

      - name: Run AMFI scheme master ingest
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret missing"
            exit 1
          fi
          python -m data_pipeline.sources.amfi_scheme_master

      - name: Write cron heartbeat
        if: success()
        run: |
          python scripts/write_cron_heartbeat.py \
            --workflow cron-mf-scheme-master-weekly \
            --interval-minutes 10080
