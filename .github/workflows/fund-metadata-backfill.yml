name: Fund metadata backfill (inception_date)

# Populates funds.inception_date from the earliest NAV in
# fund_nav_history. The AMFI scheme master leaves inception_date NULL
# (no launch date in the NAVAll feed); a fund's earliest NAV is a
# reliable proxy for its launch. Idempotent — only lowers inception
# toward the true (earlier) value.
#
# RUN ORDER: trigger this AFTER the daily-NAV backfill to inception
# (mf-nav-backfill.yml), so inception reflects the true launch rather
# than the earliest currently-available NAV. Re-running after a deeper
# NAV backfill auto-corrects.
#
# TER (ter_direct/ter_regular) is NOT handled here — AMFI publishes TER
# only as per-AMC HTML/Excel, which needs a separate scraper.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Commit the UPDATE (false = dry-run count only)"
        required: false
        default: "false"

concurrency:
  group: fund-metadata-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install driver
        run: pip install --quiet psycopg2-binary

      - name: Backfill fund inception_date
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret not set"; exit 1
          fi
          if [ "${{ github.event.inputs.apply }}" = "true" ]; then
            python scripts/backfill_fund_inception.py --apply
          else
            python scripts/backfill_fund_inception.py --dry-run
          fi
