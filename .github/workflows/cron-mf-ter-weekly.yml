name: Cron — AMFI MF TER weekly

# Weekly refresh of mutual-fund Total Expense Ratios (TER) from AMFI's
# single official TER JSON API. Fetches the latest disclosure month for
# every live MF_ID (AMC), collapses the day-granular feed to one row per
# scheme (max TER_Date), matches each TER base scheme_name to the per-plan
# scheme_codes in `funds` (AMC-scoped), and UPSERTs ter_direct / ter_regular
# into fund_returns_cache. Writes ONLY those two columns (+ computed_at),
# so it never collides with the daily returns/risk/score recompute.
#
# Schedule: Sunday 01:00 UTC = 06:30 IST.
# Runs after the scheme-master weekly (00:30 UTC) so the funds table is
# fresh before we try to match TER rows onto it.
#
# SAFETY: a scheduled run is DRY-RUN by default — it fetches, parses,
# matches, and logs the reconciliation summary WITHOUT writing. To commit
# the UPSERTs, dispatch manually with apply=true (or flip the default
# below once the match-rate has been validated from a dry-run log).
#
# Secrets required:
#   - DATABASE_URL : Neon Postgres connection string (read+write).

on:
  schedule:
    - cron: "0 1 * * 0"  # 01:00 UTC Sun = 06:30 IST Sun
  workflow_dispatch:
    inputs:
      apply:
        description: "Commit the TER UPSERTs (true) or dry-run only (false)."
        required: false
        default: "false"

concurrency:
  group: cron-mf-ter-weekly
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
      # PYTHONPATH=. so `python -m data_pipeline.sources.amfi_ter` resolves
      # the in-tree package (no pyproject.toml / setup.py in the repo).
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install "psycopg2-binary" "requests>=2.31"

      - name: Run AMFI TER ingest
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret missing"
            exit 1
          fi
          # Scheduled runs are dry-run; only an explicit apply=true commits.
          if [ "${{ github.event.inputs.apply }}" = "true" ]; then
            echo "Running AMFI TER ingest in APPLY mode (writes committed)."
            python -m data_pipeline.sources.amfi_ter --apply
          else
            echo "Running AMFI TER ingest in DRY-RUN mode (no writes)."
            python -m data_pipeline.sources.amfi_ter --dry-run
          fi

      - name: Write cron heartbeat
        if: success()
        run: |
          python scripts/write_cron_heartbeat.py \
            --workflow cron-mf-ter-weekly \
            --interval-minutes 10080
